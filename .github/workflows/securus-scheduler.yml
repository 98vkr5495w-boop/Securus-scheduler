name: Securus public scheduler

on:
  schedule:
    # Keep both collection slots away from the top of the hour and make a
    # workflow-file change so GitHub re-registers scheduled delivery.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
    - cron: "23 5 1,15 * *"
  workflow_dispatch:
    inputs:
      recovery:
        description: Run only when the full scheduler is overdue
        required: false
        default: false
        type: boolean
      maintenance_only:
        description: Run verified storage repair only; never collect or scan
        required: false
        default: false
        type: boolean
      cycle_key:
        description: Canonical UTC :07/:37 cycle supplied by the watchdog
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/securus-scheduler.yml
      - scripts/collect_source.sh
      - scripts/collect_weather.py
      - scripts/collect_kalshi.py
      - scripts/collect_kalshi_props.py
      - scripts/run_crypto_paper.py
      - scripts/verify_freshness.py
      - scripts/check_scheduler_due.py
      - scripts/maintain_storage.py
      - scripts/nba_injury_attestation.py
      - tests/**
      - external/**
      - .github/workflows/securus-watchdog.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'securus-public-validation-push'
        || github.event_name == 'pull_request' && format('securus-public-validation-pr-{0}', github.event.pull_request.number)
        || (github.event_name == 'schedule' && github.event.schedule == '23 5 1,15 * *')
        && 'securus-public-keepalive'
        || 'securus-public-runtime' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate public scripts
        run: |
          python -m py_compile \
            scripts/collect_weather.py \
            scripts/collect_kalshi.py \
            scripts/collect_kalshi_props.py \
            scripts/run_crypto_paper.py \
            scripts/verify_freshness.py \
            scripts/check_scheduler_due.py \
            scripts/maintain_storage.py \
            scripts/nba_injury_attestation.py
          python -m unittest discover -s tests -v
          node --test tests/test_external_recovery.mjs
          bash -n scripts/collect_source.sh

  maintain-storage:
    if: >-
      github.event_name != 'push' && github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || github.event.schedule != '23 5 1,15 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      SECURUS_URL: https://edgelab-sports.jkv9c8bzjn.chatgpt.site
    steps:
      - name: Check out trusted scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enforce bounded storage maintenance
        # Dedicated cleanup targets below WARNING; normal collection keeps its
        # existing admission headroom and does not wait for full backlog drain.
        run: python scripts/maintain_storage.py --target-percent ${{ inputs.maintenance_only && '74' || '83.5' }}

  cadence-gate:
    needs: maintain-storage
    if: >-
      inputs.maintenance_only != true &&
      github.event_name != 'push' && github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || github.event.schedule != '23 5 1,15 * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.due.outputs.should_run }}
      cycle_key: ${{ steps.due.outputs.cycle_key }}
      gate_state: ${{ steps.due.outputs.gate_state }}
      frequent_sources_due: ${{ steps.due.outputs.frequent_sources_due }}
      deep_sources_due: ${{ steps.due.outputs.deep_sources_due }}
    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check full-run freshness
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY: ${{ inputs.recovery }}
          REQUESTED_CYCLE: ${{ inputs.cycle_key }}
          SCHEDULED_SLOT: ${{ github.event.schedule == '7 * * * *' && '7' || github.event.schedule == '37 * * * *' && '37' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$RECOVERY" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "gate_state=DUE" >> "$GITHUB_OUTPUT"
            echo "Explicit manual run bypasses the recovery cadence gate."
          else
            cycle_args=()
            if [[ -n "$REQUESTED_CYCLE" ]]; then
              cycle_args=(--cycle-key "$REQUESTED_CYCLE")
            elif [[ -n "$SCHEDULED_SLOT" ]]; then
              cycle_args=(--cycle-slot-minute "$SCHEDULED_SLOT")
            fi
            python scripts/check_scheduler_due.py \
              --repository "$GITHUB_REPOSITORY" \
              --workflow securus-scheduler.yml \
              --branch main \
              "${cycle_args[@]}" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Surface a deferred cycle that left feeds stale
        # A green skip is only honest when feeds are fresh or another trusted
        # runtime owns the cycle. Deferral (abandoned receipt, unavailable
        # status, cooldown after a failed attempt, critical storage) must be
        # visible as a failed run; the watchdog keeps its own bounded recovery.
        if: steps.due.outputs.should_run != 'true' && steps.due.outputs.gate_state == 'DEFERRED'
        shell: bash
        run: |
          echo "::error::Scheduler cycle ${{ steps.due.outputs.cycle_key }} was deferred without refreshing decision feeds; see the freshness check above."
          exit 1

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '23 5 1,15 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Keep scheduled workflows active
        shell: bash
        run: |
          set -euo pipefail
          printf 'Last scheduler activity: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .scheduler-heartbeat
          git config user.name "Securus Scheduler"
          git config user.email "scheduler@users.noreply.github.com"
          git add .scheduler-heartbeat
          git commit -m "Keep public scheduler active" || exit 0
          git push

  collect-inputs:
    needs: cadence-gate
    if: needs.cadence-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SECURUS_URL: https://edgelab-sports.jkv9c8bzjn.chatgpt.site
    outputs:
      nba_attestation_required: ${{ steps.nba_challenge.outputs.required }}
      nba_attestation_challenge: ${{ steps.nba_challenge.outputs.challenge }}

    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Choose bounded cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          run_frequent=true
          run_deep=false
          cycle_key="${{ needs.cadence-gate.outputs.cycle_key }}"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "${{ inputs.recovery }}" != "true" && \
                "${{ needs.cadence-gate.outputs.deep_sources_due }}" == "true" && \
                "${{ needs.cadence-gate.outputs.frequent_sources_due }}" != "true" ]]; then
            run_frequent=false
          fi
          if [[ "${{ needs.cadence-gate.outputs.deep_sources_due }}" == "true" ]]; then
            run_deep=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.recovery }}" != "true" ]]; then
            run_deep=true
          elif [[ -n "$cycle_key" ]]; then
            hour=$((10#$(date -u -d "$cycle_key" +%H)))
            minute=$(date -u -d "$cycle_key" +%M)
            if [[ "$minute" == "07" ]] && ((hour % 6 == 3)); then
              run_deep=true
            fi
          fi
          echo "run_frequent=$run_frequent" >> "$GITHUB_OUTPUT"
          echo "run_deep=$run_deep" >> "$GITHUB_OUTPUT"
          echo "Frequent-source refresh: $run_frequent"
          echo "Deep-source refresh: $run_deep"

      - name: Refresh identity after storage maintenance
        id: oidc_collect
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securus-collector")
          token=$(jq -er '.value' <<<"$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refresh hosted decision feeds
        if: steps.cadence.outputs.run_frequent == 'true'
        id: hosted
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_collect.outputs.token }}
        shell: bash
        run: |
          set -u
          failures=()
          for source in mlb-stats-api action-network sleeper-nfl nba-stats; do
            if ! bash scripts/collect_source.sh "mode=fast&source=$source"; then
              failures+=("$source")
            fi
          done
          if ((${#failures[@]})); then
            echo "Hosted collectors needing attention: ${failures[*]}" >&2
            exit 1
          fi

      - name: Refresh free NFL and MLB research feeds
        if: steps.cadence.outputs.run_frequent == 'true'
        id: research
        continue-on-error: true
        timeout-minutes: 4
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_collect.outputs.token }}
        shell: bash
        run: |
          set -u
          failures=()
          for source in espn-nfl nfl-official-injuries rotoworld-nfl fangraphs-mlb cbs-mlb-injuries rotoballer-mlb; do
            if ! bash scripts/collect_source.sh "mode=fast&source=$source"; then
              failures+=("$source")
            fi
          done
          if ((${#failures[@]})); then
            echo "::warning::Optional research feeds were not refreshed: ${failures[*]}"
            exit 1
          fi

      - name: Refresh official NBA injury availability
        if: steps.cadence.outputs.run_frequent == 'true'
        id: nba_collect
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_collect.outputs.token }}
        shell: bash
        run: bash scripts/collect_source.sh "mode=fast&source=nba-official-injuries"

      - name: Refresh identity for the NBA PDF challenge
        if: steps.nba_collect.outcome == 'success'
        id: oidc_nba_challenge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securus-collector")
          token=$(jq -er '.value' <<<"$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Obtain the hash-bound NBA PDF challenge
        if: >-
          steps.nba_collect.outcome == 'success' &&
          steps.oidc_nba_challenge.outcome == 'success'
        id: nba_challenge
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_nba_challenge.outputs.token }}
        run: >-
          python scripts/nba_injury_attestation.py challenge "$SECURUS_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Refresh event weather
        if: steps.cadence.outputs.run_frequent == 'true'
        id: weather
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_collect.outputs.token }}
        run: python scripts/collect_weather.py

      - name: Refresh official Kalshi sports prices
        if: steps.cadence.outputs.run_frequent == 'true'
        id: kalshi
        continue-on-error: true
        env:
          KEYLESS_SPORT: ALL
          KALSHI_PROPS_TRANSPORT: separate
        run: python scripts/collect_kalshi.py

      - name: Refresh identity for player prop feeds
        if: steps.cadence.outputs.run_frequent == 'true'
        id: oidc_props
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securus-collector")
          token=$(jq -er '.value' <<<"$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Transport official player prop identities and prices
        if: steps.oidc_props.outcome == 'success'
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_props.outputs.token }}
        run: python scripts/collect_kalshi_props.py

      - name: Refresh independent player prop sportsbook prices
        if: steps.oidc_props.outcome == 'success'
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_props.outputs.token }}
        run: bash scripts/collect_source.sh "mode=fast&source=propline"

      - name: Refresh identity for deep sources
        if: steps.cadence.outputs.run_deep == 'true'
        id: oidc_deep
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securus-collector")
          token=$(jq -er '.value' <<<"$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refresh bounded deep statistics
        if: steps.cadence.outputs.run_deep == 'true'
        id: deep
        continue-on-error: true
        env:
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_deep.outputs.token }}
        shell: bash
        run: |
          set -u
          failures=()
          for source in nflverse baseball-savant; do
            if ! bash scripts/collect_source.sh "mode=daily&source=$source"; then
              failures+=("$source")
            fi
          done
          if ((${#failures[@]})); then
            echo "Deep collectors needing attention: ${failures[*]}" >&2
            exit 1
          fi

      - name: Recheck bounded storage after collection
        run: python scripts/maintain_storage.py --target-percent 84

  verify-nba-pdf:
    needs: collect-inputs
    if: >-
      !cancelled() &&
      needs.collect-inputs.result == 'success' &&
      needs.collect-inputs.outputs.nba_attestation_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nba_attestation: ${{ steps.verify.outputs.attestation }}
    steps:
      - name: Check out scheduler without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the bounded PDF verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext >/dev/null
          pdftotext -v

      - name: Verify the exact NBA report without credentials
        id: verify
        env:
          NBA_ATTESTATION_CHALLENGE: ${{ needs.collect-inputs.outputs.nba_attestation_challenge }}
        run: >-
          python scripts/nba_injury_attestation.py verify
          --github-output "$GITHUB_OUTPUT"

  collect-and-scan:
    name: collect-and-scan
    needs: [cadence-gate, collect-inputs, verify-nba-pdf]
    if: >-
      !cancelled() &&
      needs.cadence-gate.result == 'success' &&
      needs.cadence-gate.outputs.should_run == 'true' &&
      needs.collect-inputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      SECURUS_URL: https://edgelab-sports.jkv9c8bzjn.chatgpt.site
    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Mint identity for the NBA PDF attestation
        if: >-
          needs.collect-inputs.outputs.nba_attestation_required == 'true' &&
          needs.verify-nba-pdf.result == 'success' &&
          needs.verify-nba-pdf.outputs.nba_attestation != ''
        id: oidc_nba_attestation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securus-collector")
          token=$(jq -er '.value' <<<"$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Submit bounded NBA availability evidence
        if: steps.oidc_nba_attestation.outcome == 'success'
        id: nba_attestation
        continue-on-error: true
        env:
          NBA_ATTESTATION_RESULT: ${{ needs.verify-nba-pdf.outputs.nba_attestation }}
          SECURUS_OIDC_TOKEN: ${{ steps.oidc_nba_attestation.outputs.token }}
        run: python scripts/nba_injury_attestation.py submit "$SECURUS_URL"

      - name: Require fresh non-NBA decision inputs
        id: freshness
        continue-on-error: true
        run: >-
          python scripts/verify_freshness.py "$SECURUS_URL"
          --source mlb-stats-api
          --source action-network
          --source kalshi
          --source open-meteo
          --source sleeper-nfl
          --source nba-stats
          --source nflverse
          --source baseball-savant

      - name: Run one verified Crypto paper scan
        env:
          REQUEST_KEY: ${{ github.repository_id }}
          RECOVERY: ${{ inputs.recovery }}
          CYCLE_KEY: ${{ needs.cadence-gate.outputs.cycle_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$RECOVERY" == "true" ]]; then
            python scripts/run_crypto_paper.py "$SECURUS_URL" \
              --request-key "$REQUEST_KEY" --cycle-key "$CYCLE_KEY"
          else
            python scripts/run_crypto_paper.py "$SECURUS_URL"
          fi

      - name: Surface stale decision inputs after the scan
        if: always() && steps.freshness.outcome != 'success'
        run: |
          echo "::error::Decision-input freshness did not pass after bounded status rechecks; inspect the freshness step for source times."
          exit 1

      - name: Drain WARNING storage while feeds are fresh
        # Cleanup keeps pace only if a dedicated pass runs every cycle, not only
        # when GitHub happens to deliver a watchdog cron. This bounded pass
        # targets the same 74% as maintenance-only recovery. It cannot collect
        # or scan, cannot fail a completed cycle, and reports an incomplete
        # drain as a visible warning instead of a green result.
        if: always() && steps.freshness.outcome == 'success'
        id: drain
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status=$(curl --silent --show-error --max-time 20 -H "Accept: application/json" \
            -H "Cache-Control: no-cache" "$SECURUS_URL/api/data-sources" \
            | jq -r '.storage.capacity | select(.capacityState == "WARNING" and .utilizationPercent >= 75 and .utilizationPercent < 85) | "WARNING"' 2>/dev/null || true)
          if [[ "$status" != "WARNING" ]]; then
            echo "Storage is not in WARNING; no dedicated drain this cycle."
            exit 0
          fi
          if python scripts/maintain_storage.py --target-percent 74; then
            echo "Dedicated cleanup reached its 74% target."
          else
            echo "::warning::Dedicated storage drain did not reach 74% within its bounded budget; the next cycle continues it."
            exit 1
          fi

      - name: Surface an unassessable NBA attestation after the scan
        if: >-
          always() &&
          (
            !(
              (needs.collect-inputs.outputs.nba_attestation_required == 'false' &&
               needs.verify-nba-pdf.result == 'skipped' &&
               steps.nba_attestation.outcome == 'skipped') ||
              (needs.collect-inputs.outputs.nba_attestation_required == 'true' &&
               needs.verify-nba-pdf.result == 'success' &&
               needs.verify-nba-pdf.outputs.nba_attestation != '' &&
               steps.nba_attestation.outcome == 'success')
            )
          )
        shell: bash
        run: |
          echo "::error::NBA attestation was unassessable; inspect its challenge, verifier, and submission steps."
          exit 1
