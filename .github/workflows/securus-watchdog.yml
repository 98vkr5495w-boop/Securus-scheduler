name: Securus scheduler watchdog

on:
  schedule:
    # Lightweight checks only; actual collections remain freshness-gated.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Securus public scheduler"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: securus-public-watchdog
  cancel-in-progress: false

jobs:
  recover-overdue-scheduler:
    # Completion checks may dispatch the trusted main workflow, so never run
    # this privileged path for pull-request or foreign-repository completions.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dispatch only an overdue trusted scheduler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_scheduler_due.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow securus-scheduler.yml \
            --branch main \
            --dispatch-if-due
